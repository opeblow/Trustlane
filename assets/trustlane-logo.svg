<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="160">
  <defs>
    <style>
      .bg { fill: transparent; }
      .brand-primary { fill: #111111; }
      .brand-sub { fill: #666666; }
      .brand-stroke { stroke: #111111; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .brand-fill { fill: #111111; }
      .accent-box { fill: #111111; }
      .accent-line { stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; }
      
      @media (prefers-color-scheme: dark) {
        .brand-primary { fill: #f5f5f5; }
        .brand-sub { fill: #a3a3a3; }
        .brand-stroke { stroke: #f5f5f5; }
        .brand-fill { fill: #f5f5f5; }
        .accent-box { fill: #f5f5f5; }
        .accent-line { stroke: #111111; }
      }
    </style>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#2a2a2a" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="640" height="160" class="bg" />

  <!-- Logo Mark -->
  <g transform="translate(48, 36)">
    <!-- Outer Shield / Hexagonal Vault -->
    <rect x="0" y="0" width="88" height="88" rx="20" class="accent-box" />
    
    <!-- Modern Geometric T & Dual Guardrail Lanes -->
    <!-- Horizontal Crossbar of T -->
    <path d="M 22 28 L 66 28" class="accent-line" stroke-width="4.5" stroke-linecap="round" />
    <!-- Center Stem of T -->
    <path d="M 44 28 L 44 64" class="accent-line" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Left Lane Guide -->
    <path d="M 28 40 L 28 58" class="accent-line" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.8" />
    <!-- Right Lane Guide -->
    <path d="M 60 40 L 60 58" class="accent-line" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.8" />

    <!-- Corner Trust Dots -->
    <circle cx="22" cy="64" r="2" class="accent-line" />
    <circle cx="66" cy="64" r="2" class="accent-line" />
  </g>

  <!-- Typography -->
  <g transform="translate(160, 48)">
    <!-- Wordmark -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="3" class="brand-primary">TRUSTLANE</text>
    
    <!-- Tagline / Badge text -->
    <text x="2" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" text-transform="uppercase" class="brand-sub">AUTONOMOUS PROCUREMENT COPILOT • POWERED BY PAYPAL</text>
  </g>
</svg>
